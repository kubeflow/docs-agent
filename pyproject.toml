[tool.ruff]
target-version = "py39"
line-length = 120
exclude = ["legacy"]

[tool.ruff.lint]
# Pinned explicitly rather than relying on ruff's defaults: ruff 0.16 widened
# the default rule set (import sorting, flake8-datetimez, flake8-blind-except,
# ...) and turned a green main red on the next CI run. These four groups are
# the set this repo has always linted against; the per-file-ignores below are
# expressed in terms of them.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"kagent-feast-mcp/pipelines/*.py" = ["F403", "F405", "F841", "E741"]
"scripts/index_real_issues.py" = ["F401", "E741"]
"legacy/server/app.py" = ["F401"]
"tests/test_code_utils.py" = ["E402"]
"tests/test_issues_pipeline.py" = ["E402"]
"tests/test_pipeline_utils.py" = ["E402"]
