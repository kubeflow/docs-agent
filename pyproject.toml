[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kubeflow-docs-cli"
version = "0.1.0"
description = "Lifecycle CLI for spinning up and tearing down Kubeflow Docs Agent dev clusters on OCI OKE with Netlify integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "oci>=2.125.0",
    "click>=8.1",
    "rich>=13.7",
    "pyyaml>=6.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
docs-cli = "docs_cli.cli:main"
docsctl = "docs_cli.cli:main"

[tool.setuptools.packages.find]
where = ["cli"]
include = ["docs_cli*"]

[tool.pytest.ini_options]
testpaths = ["cli/tests"]
pythonpath = ["cli"]
