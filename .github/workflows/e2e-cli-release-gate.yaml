# Release & On-Demand E2E Gate for `docs-cli`.
# 1. Always runs Expected-Architecture Contract Gate (`docs-cli update --check --diagnose`)
#    and `terraform validate` across both Terraform stacks on release events and manual dispatch.
# 2. Optionally spins up an ephemeral OKE environment (`run_live_oke: true`), runs the 35-check
#    `docs-cli verify` suite (including multi-agent A2A streams), and unconditionally destroys
#    all cloud resources down to 0 (`if: always()`).
name: CLI Release & E2E Gate

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      cloud_provider:
        description: "Target cloud provider for live E2E spin-up ('oci' or 'gcp')"
        required: false
        default: "oci"
        type: choice
        options:
          - oci
          - gcp
      run_live_oke:
        description: "Provision an ephemeral OKE/GKE cluster, run docs-cli verify, and destroy (--yes)"
        required: false
        default: false
        type: boolean
      no_gpu:
        description: "Run CPU-only mode (--no-gpu) with external OpenAI-compatible LLM instead of GPU pool"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  architecture-contract-gate:
    name: Expected Architecture & Terraform Schema Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          pip install -e .

      - name: Validate CLI Expected Architecture & Secret Contracts
        run: |
          pytest cli/tests -v --tb=short
          docs-cli update --check --diagnose

      - name: Validate OKE, GKE & Platform Terraform Schemas
        run: |
          docs-cli template --cloud oci --domain ci-check.example.org
          docs-cli template --cloud gcp --domain ci-check.example.org
          terraform -chdir=deployments/terraform/oke-cluster init -backend=false
          terraform -chdir=deployments/terraform/oke-cluster validate
          terraform -chdir=deployments/terraform/gke-cluster init -backend=false
          terraform -chdir=deployments/terraform/gke-cluster validate
          python -c "from docs_cli.config import DocsConfig; from docs_cli.terraform import ensure_kubeflow_manifests_charts; ensure_kubeflow_manifests_charts(DocsConfig.load())"
          terraform -chdir=docs-agent-mcp/terraform init -backend=false
          terraform -chdir=docs-agent-mcp/terraform validate

      - name: Publish Expected-Architecture Report
        if: always()
        run: |
          if [ -f .docs-cli/drift-diagnosis.json ]; then
            echo "### \`docs-cli\` Release Architecture Gate" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`json" >> "$GITHUB_STEP_SUMMARY"
            cat .docs-cli/drift-diagnosis.json >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          fi

  live-oke-e2e:
    name: Ephemeral OKE Spin-Up, Verify & Destroy
    needs: architecture-contract-gate
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_oke == true
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: docs-cli-live-oke-e2e
      cancel-in-progress: false
    env:
      OCI_REGION: ${{ secrets.OCI_REGION }}
      OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
      OCI_USER: ${{ secrets.OCI_USER }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
      DOCS_CLUSTER_NAME: kubeflow-docs-agent-ci-${{ github.run_id }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Helm & Terraform
        uses: azure/setup-helm@v4
        with:
          version: v3.21.0

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Install OCI CLI & docs-cli
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          pip install -e .
          mkdir -p ~/.oci
          printf '%s\n' "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          echo "OCI_KEY_FILE=$HOME/.oci/oci_api_key.pem" >> "$GITHUB_ENV"

      - name: Spin up ephemeral OKE/GKE stack & run 35-check verification
        timeout-minutes: 40
        run: |
          CLOUD_NAME="${{ inputs.cloud_provider || 'oci' }}"
          EXTRA_FLAGS="--cloud ${CLOUD_NAME}"
          if [ "${{ inputs.no_gpu }}" = "true" ]; then
            EXTRA_FLAGS="${EXTRA_FLAGS} --no-gpu"
          fi
          docs-cli up $EXTRA_FLAGS --apply --ttl 2h
          docs-cli verify --cloud "${CLOUD_NAME}"

      - name: Tear down ephemeral OKE/GKE stack down to 0 resources
        if: always()
        timeout-minutes: 15
        run: |
          CLOUD_NAME="${{ inputs.cloud_provider || 'oci' }}"
          docs-cli destroy --cloud "${CLOUD_NAME}" --yes
