name: PR Safety

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.15.9

      - name: Run ruff lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check docs-agent-mcp/mcp-server tests

  compile:
    name: Python compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python sources
        run: |
          python -m compileall \
            docs-agent-mcp/pipelines \
            docs-agent-mcp/mcp-server \
            legacy/server \
            legacy/server-https \
            scripts \
            tests

  helm:
    name: Helm lint and render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.0

      - name: Lint charts
        run: |
          helm lint docs-agent-mcp/charts/docs-agent
          helm lint docs-agent-mcp/charts/qwen-runtime
          helm lint docs-agent-mcp/charts/gateway-guardrails

      - name: Render charts
        run: |
          helm template docs-agent docs-agent-mcp/charts/docs-agent \
            --namespace docs-agent --set-string mcp.image.tag=ci-test >/dev/null
          helm template qwen-runtime docs-agent-mcp/charts/qwen-runtime \
            --namespace ml-infra >/dev/null
          helm template gateway-guardrails docs-agent-mcp/charts/gateway-guardrails \
            --namespace docs-agent >/dev/null

  test:
    name: Pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run tests
        run: pytest -v --tb=short
