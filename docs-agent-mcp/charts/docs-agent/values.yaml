# MCP and Kagent application values. GPU serving and edge guardrails are
# deliberately separate Helm releases so an ordinary app upgrade cannot
# recycle the GPU InferenceService (llm-runtime) or change public routing.

mcp:
  replicaCount: 1
  image:
    repository: ghcr.io/kubeflow/mcp-kubeflow-docs
    tag: v0.1.0
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  service:
    port: 8000
  config:
    docsCollection: kubeflow_docs
    issuesCollection: issues_rag
    codeCollection: code_rag
    embeddingsUrl: http://embeddings-service-predictor.ml-infra.svc.cluster.local/embed
    milvusUri: http://milvus-milvus.ml-infra.svc.cluster.local:19530
    milvusUser: root
    maxQueryChars: 512
    maxTopK: 10
    maxCandidateHits: 40
    # auto = intent router picks bm25/hybrid/dense per query (needs the v4 hybrid collection).
    searchMode: auto
    autoBm25CandidateDepth: 30
    autoTemporalCandidateDepth: 50
    hybridRanker: rrf
    hybridRrfK: 60
    hybridDenseWeight: "0.7"
    hybridSparseWeight: "0.3"
  milvusAuth:
    existingSecret: mcp-server-secret
    passwordKey: MILVUS_PASSWORD
  # Extra container env, e.g. tracing keys read from an existing Secret:
  #   - name: LANGFUSE_PUBLIC_KEY
  #     valueFrom: {secretKeyRef: {name: mcp-langfuse-keys, key: LANGFUSE_PUBLIC_KEY}}
  extraEnv: []
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 5
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 30
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

kagent:
  enabled: true
  # Shared by every ModelConfig; the in-cluster LLM endpoints ignore the value.
  apiKeySecret:
    name: kagent-kserve
    key: OPENAI_API_KEY
    create: true
    value: local-kserve
  # One ModelConfig per entry (provider OpenAI). Agents pick one by name.
  # Both point at the llm-runtime release; which model answers is decided
  # there by its `model` value, so nothing here changes on a model switch.
  # reasoningEffort low/medium/high turns thinking on per request when the
  # active model supports it; models without a thinking mode ignore it.
  models:
    - name: flo-llm
      model: flo-llm
      baseUrl: http://llm-stable.ml-infra.svc.cluster.local/v1
      temperature: "0.4"
      topP: "0.9"
      # Prompt + output must fit maxModelLen (32768) in llm-runtime.
      maxTokens: 8192
      timeout: 300
    - name: flo-llm-think
      model: flo-llm
      baseUrl: http://llm-stable.ml-infra.svc.cluster.local/v1
      temperature: "0.4"
      topP: "0.9"
      # Reasoning tokens count against this; 1024 truncates it.
      maxTokens: 8192
      timeout: 300
      reasoningEffort: low
  remoteMcp:
    name: kubeflow-docs-mcp
    timeout: 30s
  # Keyed by role; the frontend picks an agent by name.
  agents:
    docs:
      name: kubeflow-docs-agent
      enabled: true
      description: Kubeflow documentation assistant
      modelConfig: flo-llm
      systemMessageFile: files/docs-system-message.txt
      toolNames:
        - search_kubeflow_docs
        - search_github_issues
    docsThink:
      name: kubeflow-docs-agent-think
      enabled: true
      description: Kubeflow documentation assistant (thinking on)
      modelConfig: flo-llm-think
      systemMessageFile: files/docs-system-message.txt
      toolNames:
        - search_kubeflow_docs
        - search_github_issues
    debug:
      name: kubeflow-debug-agent
      enabled: true
      description: Kubeflow debugging and code assistant
      modelConfig: flo-llm
      systemMessageFile: files/debug-system-message.txt
      toolNames:
        - search_kubeflow_code
        - search_github_issues
        - search_kubeflow_docs

# End-to-end eval as an Argo CD PostSync hook (staging only). See templates/eval-job.yaml.
eval:
  enabled: false
  image: mirror.gcr.io/library/python:3.12-slim
  # Where the eval script is fetched from, and the commit being evaluated. Argo CD sets
  # revision from $ARGOCD_APP_REVISION (helm parameter in the Application).
  repo: kubeflow/docs-agent
  revision: ""
  # Repository whose PRs and authors label the run in Langfuse.
  prRepo: kubeflow/docs-agent
  agentBase: http://kagent-controller.docs-agent.svc.cluster.local:8083
  judgeUrl: http://llm-judge.ml-infra.svc.cluster.local/v1/chat/completions
  judgeModel: flo-judge
  langfuseHost: http://langfuse-web.langfuse.svc.cluster.local:3000
  langfuseSecret: mcp-langfuse-keys
  minRouting: "0.85"
  minGrounded: "0.65"
  concurrency: "3"
  # Number of cases to run; "0" = all. Use "1" for a quick smoke run.
  limit: "0"
  timeoutSeconds: 1800

# Nightly triage of thumbs-down answers (see templates/triage-cronjob.yaml).
triage:
  enabled: false
  schedule: "0 3 * * *"
  sinceHours: 24
  image: mirror.gcr.io/library/python:3.12-slim
  repo: kubeflow/docs-agent
  ref: main
  langfuseHost: http://langfuse-web.langfuse.svc.cluster.local:3000
  # Keys of the project that holds the live chat traces (where user_feedback lands).
  langfuseSecret: mcp-langfuse-keys
  judgeUrl: http://llm-judge.ml-infra.svc.cluster.local/v1/chat/completions
  judgeModel: flo-judge

tests:
  enabled: true
  image: docker.io/library/busybox:1.37
