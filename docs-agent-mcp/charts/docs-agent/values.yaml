# MCP and Kagent application values. GPU serving and edge guardrails are
# deliberately separate Helm releases so an ordinary app upgrade cannot
# recycle the single-GPU InferenceService or change public routing.

mcp:
  replicaCount: 1
  image:
    repository: ghcr.io/kubeflow/mcp-kubeflow-docs
    tag: v0.1.0
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  service:
    port: 8000
  config:
    docsCollection: kubeflow_docs
    issuesCollection: issues_rag
    codeCollection: code_rag
    embeddingsUrl: http://embeddings-service-predictor.ml-infra.svc.cluster.local/embed
    milvusUri: http://milvus-milvus.ml-infra.svc.cluster.local:19530
    milvusUser: root
    maxQueryChars: 512
    maxTopK: 10
    maxCandidateHits: 40
    # auto = intent router picks bm25/hybrid/dense per query (needs the v4 hybrid collection).
    searchMode: auto
    autoBm25CandidateDepth: 30
    autoTemporalCandidateDepth: 50
    hybridRanker: rrf
    hybridRrfK: 60
    hybridDenseWeight: "0.7"
    hybridSparseWeight: "0.3"
  milvusAuth:
    existingSecret: mcp-server-secret
    passwordKey: MILVUS_PASSWORD
  # Tracing stays off when the secret is absent; the keys are optional refs.
  langfuse:
    existingSecret: mcp-langfuse-keys
    publicKeyKey: LANGFUSE_PUBLIC_KEY
    secretKeyKey: LANGFUSE_SECRET_KEY
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 5
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 30
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

# Forces tool_choice=required for in-scope user turns (none for chit-chat)
# before requests reach Qwen. When enabled, the ModelConfig points here.
toolChoiceProxy:
  enabled: true
  # Empty reuses the MCP image (python + stdlib is all the proxy needs).
  image: ""
  upstream: http://qwen-llm-stable.ml-infra.svc.cluster.local
  port: 8080
  affinity: {}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

kagent:
  enabled: true
  model:
    name: kserve-qwen
    provider: OpenAI
    model: qwen2.5-7B
    # Used only when toolChoiceProxy is disabled.
    baseUrl: http://qwen-llm-stable.ml-infra.svc.cluster.local/openai/v1
    temperature: "0.1"
    topP: "0.9"
    maxTokens: 1024
    timeout: 300
    apiKeySecret:
      name: kagent-kserve
      key: OPENAI_API_KEY
      create: true
      # The in-cluster KServe endpoint does not authenticate this dummy value.
      value: local-kserve
  remoteMcp:
    name: kubeflow-docs-mcp
    timeout: 30s
  agents:
    docs:
      name: kubeflow-docs-agent
      enabled: true
      toolNames:
        - search_kubeflow_docs
        - search_github_issues
    debug:
      name: kubeflow-debug-agent
      enabled: true
      toolNames:
        - search_kubeflow_code
        - search_github_issues
        - search_kubeflow_docs

tests:
  enabled: true
  image: busybox:1.37
