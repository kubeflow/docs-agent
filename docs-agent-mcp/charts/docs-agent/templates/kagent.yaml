{{- if .Values.kagent.enabled }}
{{- $secret := .Values.kagent.apiKeySecret }}
{{- if $secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret.name }}
  labels:
    {{- include "docs-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $secret.key }}: {{ $secret.value | quote }}
---
{{- end }}
{{- $modelNames := list }}
{{- range .Values.kagent.models }}
{{- $modelNames = append $modelNames .name }}
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: {{ .name }}
  labels:
    {{- include "docs-agent.labels" $ | nindent 4 }}
spec:
  provider: OpenAI
  apiKeySecret: {{ $secret.name }}
  apiKeySecretKey: {{ $secret.key }}
  model: {{ .model }}
  openAI:
    baseUrl: {{ .baseUrl | quote }}
    temperature: {{ .temperature | quote }}
    topP: {{ .topP | quote }}
    maxTokens: {{ .maxTokens }}
    timeout: {{ .timeout }}
    {{- with .reasoningEffort }}
    reasoningEffort: {{ . }}
    {{- end }}
---
{{- end }}
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: {{ .Values.kagent.remoteMcp.name }}
  labels:
    {{- include "docs-agent.labels" . | nindent 4 }}
spec:
  description: MCP server for grounded Kubeflow documentation, issue, and code search
  url: http://{{ include "docs-agent.mcpName" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.mcp.service.port }}/mcp
  timeout: {{ .Values.kagent.remoteMcp.timeout }}
{{- range $role, $agent := .Values.kagent.agents }}
{{- if $agent.enabled }}
{{- if not (has $agent.modelConfig $modelNames) }}
{{- fail (printf "kagent.agents.%s.modelConfig %q is not in kagent.models" $role $agent.modelConfig) }}
{{- end }}
---
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: {{ $agent.name }}
  labels:
    {{- include "docs-agent.labels" $ | nindent 4 }}
spec:
  description: {{ $agent.description }}
  type: Declarative
  declarative:
    modelConfig: {{ $agent.modelConfig }}
    stream: true
    tools:
      - type: McpServer
        mcpServer:
          name: {{ $.Values.kagent.remoteMcp.name }}
          kind: RemoteMCPServer
          toolNames:
            {{- toYaml $agent.toolNames | nindent 12 }}
    systemMessage: |-
      {{- $.Files.Get $agent.systemMessageFile | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}
