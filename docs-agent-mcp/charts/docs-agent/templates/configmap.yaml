apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-server-config
  labels:
    {{- include "docs-agent.labels" . | nindent 4 }}
data:
  COLLECTION_NAME: {{ .Values.mcp.config.docsCollection | quote }}
  ISSUES_COLLECTION_NAME: {{ .Values.mcp.config.issuesCollection | quote }}
  CODE_COLLECTION_NAME: {{ .Values.mcp.config.codeCollection | quote }}
  EMBEDDINGS_URL: {{ .Values.mcp.config.embeddingsUrl | quote }}
  RERANKER_URL: {{ .Values.mcp.config.rerankerUrl | quote }}
  MILVUS_URI: {{ .Values.mcp.config.milvusUri | quote }}
  MILVUS_USER: {{ .Values.mcp.config.milvusUser | quote }}
  MAX_QUERY_CHARS: {{ .Values.mcp.config.maxQueryChars | quote }}
  DOCS_CONTEXT_MAX_CHARS: {{ .Values.mcp.config.docsContextMaxChars | quote }}
  MAX_TOP_K: {{ .Values.mcp.config.maxTopK | quote }}
  MAX_CANDIDATE_HITS: {{ .Values.mcp.config.maxCandidateHits | quote }}
  SEARCH_MODE: {{ .Values.mcp.config.searchMode | quote }}
  AUTO_BM25_CANDIDATE_DEPTH: {{ .Values.mcp.config.autoBm25CandidateDepth | quote }}
  AUTO_TEMPORAL_CANDIDATE_DEPTH: {{ .Values.mcp.config.autoTemporalCandidateDepth | quote }}
  HYBRID_RANKER: {{ .Values.mcp.config.hybridRanker | quote }}
  HYBRID_RRF_K: {{ .Values.mcp.config.hybridRrfK | quote }}
  HYBRID_DENSE_WEIGHT: {{ .Values.mcp.config.hybridDenseWeight | quote }}
  HYBRID_SPARSE_WEIGHT: {{ .Values.mcp.config.hybridSparseWeight | quote }}
  PORT: {{ .Values.mcp.service.port | quote }}
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
