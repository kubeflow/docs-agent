{{- if .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-mcp-connection-test"
  labels:
    {{- include "docs-agent.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: tcp-check
      image: {{ .Values.tests.image }}
      command: ["sh", "-ec"]
      args:
        - {{ printf "nc -z -w 10 %s %v" (include "docs-agent.mcpName" .) .Values.mcp.service.port | quote }}
{{- end }}
