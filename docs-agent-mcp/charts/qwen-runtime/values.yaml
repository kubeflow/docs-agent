runtime:
  name: llm-runtime
  image: docker.io/kserve/huggingfaceserver:v0.15.2-gpu
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
      nvidia.com/gpu: "1"
    limits:
      cpu: "16"
      memory: 64Gi
      nvidia.com/gpu: "1"

inferenceService:
  name: qwen-llm-standard
  deploymentMode: Standard
  containerConcurrency: 1
  deploymentStrategy: Recreate
  minReplicas: 1
  deploymentTimeout: "3600"
  modelName: qwen2.5-7B
  modelId: Qwen/Qwen2.5-7B-Instruct-AWQ
  args:
    - --backend=vllm
    - --max-model-len=32768
    - --gpu-memory-utilization=0.90
    - --quantization=awq
    - --enable-auto-tool-choice
    - --tool-call-parser=hermes
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
      ephemeral-storage: 16Gi
      nvidia.com/gpu: "1"
    limits:
      cpu: "16"
      memory: 64Gi
      ephemeral-storage: 24Gi
      nvidia.com/gpu: "1"
  nodeSelector:
    nvidia.com/gpu: "true"
    disk: 150gb
  tolerations:
    - operator: Exists

persistence:
  create: true
  claimName: qwen-hf-cache
  accessMode: ReadWriteOnce
  size: 50Gi
  storageClassName: ""
  keepOnDelete: true

stableService:
  name: qwen-llm-stable
  port: 80
  targetPort: 8080

tests:
  enabled: true
  # Exercise the same namespace-to-LLM AuthorizationPolicy path as Kagent.
  namespace: docs-agent
  image: curlimages/curl:8.12.1
