{{- if .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-model-endpoint-test"
  namespace: {{ .Values.tests.namespace }}
  labels:
    {{- include "qwen-runtime.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: {{ .Values.tests.image }}
      command: ["sh", "-ec"]
      args:
        - >-
          curl --fail --silent --show-error --max-time 60
          http://{{ .Values.stableService.name }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.stableService.port }}/openai/v1/models
{{- end }}
