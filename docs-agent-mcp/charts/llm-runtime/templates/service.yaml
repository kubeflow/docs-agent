apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}
  labels:
    {{- include "llm-runtime.labels" . | nindent 4 }}
spec:
  selector:
    serving.kserve.io/inferenceservice: {{ .Values.inferenceService.name }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
  type: ClusterIP
