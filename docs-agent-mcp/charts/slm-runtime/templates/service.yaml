apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}
  labels:
    {{- include "slm-runtime.labels" . | nindent 4 }}
    {{- toYaml .Values.selectorLabels | nindent 4 }}
spec:
  selector:
    {{- toYaml .Values.selectorLabels | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
  type: ClusterIP
