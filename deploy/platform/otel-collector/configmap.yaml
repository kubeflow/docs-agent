# OpenTelemetry collector for agent and MCP spans. Was hand-applied; now in Git.
# Spans from pods in docs-agent-staging go to the Langfuse evaluation project;
# everything else goes to the live project. The namespace is looked up by the
# k8sattributes processor from the sending pod's IP (kagent's agent runtime does not
# apply OTEL_RESOURCE_ATTRIBUTES, so the agents cannot tag themselves). Each project's
# Basic-auth header comes from the Secret langfuse-otlp (keys never in Git).
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: docs-agent
  labels:
    app: otel-collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      # Drop framework transport spans that bury the agent/tool/LLM spans in Langfuse.
      filter/noise:
        error_mode: ignore
        traces:
          span:
            - 'IsMatch(name, "^a2a\\.(server|utils)\\.")'
            - 'IsMatch(name, "^(POST|GET|PUT|PATCH|DELETE)( /api/(tasks|sessions).*| / http (send|receive))?$")'
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        pod_association:
          - sources:
              - from: connection
        extract:
          metadata: [k8s.namespace.name, k8s.pod.name, k8s.deployment.name]
      # Langfuse environment filter: production for the live route, staging for the eval route.
      resource/production:
        attributes:
          - {key: langfuse.environment, value: production, action: upsert}
      resource/staging:
        attributes:
          - {key: langfuse.environment, value: staging, action: upsert}
      batch:
    connectors:
      routing:
        default_pipelines: [traces/live]
        table:
          - context: resource
            condition: attributes["k8s.namespace.name"] == "docs-agent-staging"
            pipelines: [traces/eval]
    exporters:
      otlphttp/live:
        endpoint: http://langfuse-web.langfuse.svc.cluster.local:3000/api/public/otel
        headers:
          Authorization: ${env:LANGFUSE_OTLP_AUTHORIZATION}
          x-langfuse-ingestion-version: ${env:LANGFUSE_OTLP_INGESTION_VERSION}
      otlphttp/eval:
        endpoint: http://langfuse-web.langfuse.svc.cluster.local:3000/api/public/otel
        headers:
          Authorization: ${env:LANGFUSE_OTLP_AUTHORIZATION_EVAL}
          x-langfuse-ingestion-version: ${env:LANGFUSE_OTLP_INGESTION_VERSION}
    service:
      pipelines:
        traces/in:
          receivers: [otlp]
          processors: [k8sattributes, filter/noise]
          exporters: [routing]
        traces/live:
          receivers: [routing]
          processors: [resource/production, batch]
          exporters: [otlphttp/live]
        traces/eval:
          receivers: [routing]
          processors: [resource/staging, batch]
          exporters: [otlphttp/eval]
