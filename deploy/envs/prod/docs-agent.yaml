# Production values for the demo cluster. Public by design: no secrets here.
mcp:
  image:
    # Built by CI from main (#266 merge, adds Langfuse tracing). Promote by changing this tag in a PR.
    repository: ghcr.io/kubeflow/mcp-kubeflow-docs
    tag: eb53144
  # Tracing keys for the MCP server (Secret created by an admin; were hand-added with kubectl set env).
  extraEnv:
    - name: LANGFUSE_PUBLIC_KEY
      valueFrom:
        secretKeyRef: {name: mcp-langfuse-keys, key: LANGFUSE_PUBLIC_KEY}
    - name: LANGFUSE_SECRET_KEY
      valueFrom:
        secretKeyRef: {name: mcp-langfuse-keys, key: LANGFUSE_SECRET_KEY}
