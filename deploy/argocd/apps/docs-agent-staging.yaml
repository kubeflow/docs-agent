# Staging: follows main and syncs automatically (self-heal on, prune on).
# Not public: reached in-cluster through the kagent controller A2A API
# (/api/a2a/docs-agent-staging/<agent>), which is what the eval job calls.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: docs-agent-staging
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/kubeflow/docs-agent
      targetRevision: main
      path: docs-agent-mcp/charts/docs-agent
      helm:
        releaseName: docs-agent-staging
        valueFiles:
          - $values/deploy/envs/staging/docs-agent.yaml
        # The commit under test: its image (CI tags every main build with the short SHA)
        # and, for the eval Job, its revision. Every merge changes the image, so every
        # merge syncs staging and runs the eval.
        parameters:
          - name: mcp.image.tag
            value: $ARGOCD_APP_REVISION_SHORT
          - name: eval.revision
            value: $ARGOCD_APP_REVISION
    - repoURL: https://github.com/kubeflow/docs-agent
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: docs-agent-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # Argo CD can see a merge before CI has pushed its image; retry while the pull fails.
    retry:
      limit: 5
      backoff:
        duration: 2m
        factor: 2
        maxDuration: 15m
