# Weekly Langfuse data retention (deploy/platform/langfuse-retention), synced automatically.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: langfuse-retention
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kubeflow/docs-agent
    targetRevision: main
    path: deploy/platform/langfuse-retention
  destination:
    server: https://kubernetes.default.svc
    namespace: langfuse
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
