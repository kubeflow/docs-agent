# Production: pinned to a commit that passed the staging eval, and synced automatically.
# Promote with deploy/promote.sh, which moves every `# prod-revision` line to a newer commit.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: docs-agent
  namespace: argocd
spec:
  project: default
  # Chart and per-environment values both come from this repo (second source = values ref).
  # deploy/envs/prod/ is public and holds no secrets; secrets are Kubernetes Secrets referenced by name.
  sources:
    - repoURL: https://github.com/kubeflow/docs-agent
      targetRevision: 9145c31077524f98658d9f47f1e5d6bb8689919f  # prod-revision
      path: docs-agent-mcp/charts/docs-agent
      helm:
        releaseName: docs-agent
        valueFiles:
          - $values/deploy/envs/prod/docs-agent.yaml
        # CI tags every main build with the short commit SHA, so the image follows the commit.
        parameters:
          - name: mcp.image.tag
            value: $ARGOCD_APP_REVISION_SHORT
    - repoURL: https://github.com/kubeflow/docs-agent
      targetRevision: 9145c31077524f98658d9f47f1e5d6bb8689919f  # prod-revision
      ref: values
  # Objects adopted from Helm have no Argo tracking-id until the first sync, which would flag every
  # resource OutOfSync on that annotation alone. Ignore it so only real drift shows.
  ignoreDifferences:
    - group: "*"
      kind: "*"
      jqPathExpressions:
        - '.metadata.annotations."argocd.argoproj.io/tracking-id"'
  destination:
    server: https://kubernetes.default.svc
    namespace: docs-agent
  # The pinned commit is the approval gate, so syncing it is automatic.
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
