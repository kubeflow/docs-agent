# Observe-only: no syncPolicy. Langfuse holds live chat traces; sync by hand after reviewing the diff.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: langfuse
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://langfuse.github.io/langfuse-k8s
      chart: langfuse
      targetRevision: 2.1.0
      helm:
        releaseName: langfuse
        valueFiles:
          - $values/deploy/envs/prod/langfuse/values.yaml
    - repoURL: https://github.com/kubeflow/docs-agent
      targetRevision: main
      ref: values
  ignoreDifferences:
    - group: "*"
      kind: "*"
      jqPathExpressions:
        - '.metadata.annotations."argocd.argoproj.io/tracking-id"'
    # The chart keeps generated credentials with Helm `lookup`, which Argo CD cannot run,
    # so every render produces new random passwords. Never overwrite the live ones.
    # Rendered empty because the credentials live in langfuse-app-credentials; keep the
    # old copy's data rather than blanking it.
    - kind: Secret
      name: langfuse-app
      jsonPointers: [/data]
    - kind: Secret
      name: langfuse-clickhouse-auth
      jsonPointers: [/data]
    - kind: Secret
      name: langfuse-postgresql-auth
      jsonPointers: [/data]
    - kind: Secret
      name: langfuse-redis-auth
      jsonPointers: [/data]
    - kind: Secret
      name: langfuse-s3-auth
      jsonPointers: [/data]
    - kind: Secret
      name: langfuse-s3-sftp-secret
      jsonPointers: [/data]
  syncPolicy:
    syncOptions:
      - RespectIgnoreDifferences=true
  destination:
    server: https://kubernetes.default.svc
    namespace: langfuse
