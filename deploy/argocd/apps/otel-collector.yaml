# Observe-only: plain manifests in deploy/platform/otel-collector.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kubeflow/docs-agent
    targetRevision: main
    path: deploy/platform/otel-collector
  ignoreDifferences:
    - group: "*"
      kind: "*"
      jqPathExpressions:
        - '.metadata.annotations."argocd.argoproj.io/tracking-id"'
  destination:
    server: https://kubernetes.default.svc
    namespace: docs-agent
