# Plain manifests in deploy/platform/otel-collector, synced automatically from main.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kubeflow/docs-agent
    targetRevision: main
    path: deploy/platform/otel-collector
  ignoreDifferences:
    - group: "*"
      kind: "*"
      jqPathExpressions:
        - '.metadata.annotations."argocd.argoproj.io/tracking-id"'
  destination:
    server: https://kubernetes.default.svc
    namespace: docs-agent
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
